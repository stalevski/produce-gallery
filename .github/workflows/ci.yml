name: CI / Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Allow GITHUB_TOKEN to deploy to Pages
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    name: Type check & build
    runs-on: ubuntu-latest
    # A lost runner otherwise leaves this run "in progress" for GitHub's 6-hour
    # default, and cancel requests are no-ops because nothing is listening.
    # Backstop only: the per-step timeouts below (15 + 10 min) are what bound a
    # normal run, so this stays comfortably above their sum.
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc -b

      - name: Build
        run: npm run build

      - name: Install Playwright browsers
        # Normal cold install is ~40s; one observed run took 16 min on a slow
        # runner. Bound it so a stalled download fails here instead of eating
        # the whole job budget.
        timeout-minutes: 15
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Run smoke tests
        # ~1-3 min normally. Playwright's own globalTimeout (10 min, see
        # playwright.config.ts) trips first so the report still gets written.
        timeout-minutes: 10
        run: npx playwright test
        env:
          CI: "true"

      - name: Upload Playwright report on failure
        # failure() || cancelled() so a hung run that the job timeout kills
        # still leaves evidence; a plain failure() upload is skipped when the
        # step is cancelled.
        if: failure() || cancelled()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    # Same lost-runner bound as the build job; a deploy normally takes seconds.
    timeout-minutes: 10
    # Don't queue overlapping deploys; serialize so the latest push wins.
    # Scoped to the deploy job so PR builds run in parallel.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5

  auto-merge:
    name: Auto-merge Dependabot minor & patch
    needs: build
    if: github.event_name == 'pull_request' && github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Fetch Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Squash-merge minor, patch & GitHub Actions updates
        # GitHub Actions bumps are validated by this same CI run, so they are
        # safe to auto-merge even on a major; npm/nuget majors stay manual.
        if: >-
          steps.meta.outputs.update-type == 'version-update:semver-minor' ||
          steps.meta.outputs.update-type == 'version-update:semver-patch' ||
          steps.meta.outputs.package-ecosystem == 'github_actions'
        run: |
          gh pr merge --squash "$PR_URL" \
            || echo "::notice::Merge deferred; Dependabot will rebase and retry."
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
