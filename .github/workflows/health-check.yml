name: Weekly health check

# Runs the smoke tests against the current main branch every Monday morning,
# even if no commits land that week. Catches drift from external dependencies
# (Wikidata schema, font CDNs that we'd missed self-hosting, deprecated GitHub
# Actions warnings, etc.) before someone notices the live site is broken.
#
# Free signal, ~2 minutes of CI a week. Failure emails the repo owner.

on:
  schedule:
    # 06:00 UTC every Monday. Cron in GitHub Actions uses UTC.
    - cron: "0 6 * * 1"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  smoke:
    name: Smoke tests
    runs-on: ubuntu-latest
    # Backstop for a runner that walks away mid-job (a lost runner otherwise
    # keeps the run "in progress" for GitHub's 6-hour default and cannot be
    # cancelled, because no runner is alive to acknowledge it). The per-step
    # timeouts below bound a normal run well before this.
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc -b

      - name: Build
        run: npm run build

      - name: Install Playwright browsers
        timeout-minutes: 15
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Run smoke tests
        # Playwright's own globalTimeout (10 min, see playwright.config.ts)
        # trips before this so the report is written on a hang.
        timeout-minutes: 10
        run: npx playwright test
        env:
          CI: "true"

      - name: Upload Playwright report on failure
        if: failure() || cancelled()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
          if-no-files-found: ignore
